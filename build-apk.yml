name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract any zip file
        run: |
          mkdir -p project
          # پیدا کردن هر فایل زیپی که آپلود کردی و اکسترکت کردن آن
          ZIP_FILE=$(ls *.zip | head -n 1)
          echo "Extracting $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d project
          
          # بررسی ساختار پوشه‌ها
          if [ -d "project/android_source_for_github" ]; then
            cd project/android_source_for_github
            unzip -o *.zip -d extracted || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK with Gradle
        run: |
          # پیدا کردن مسیر gradlew در هر پوشه‌ای که باشد
          GRADLE_DIR=$(dirname $(find . -name "gradlew" | head -n 1))
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HM-Studio-App-APK
          path: "**/app-debug.apk"
          
