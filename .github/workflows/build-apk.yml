name: Build Android APK V5

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HM Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find V5 project ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "FINDING V5 PROJECT ZIP"
          echo "======================================"

          ZIP_FILE=""

          if [ -f "./hm-studio-app-v5-complete-root.zip" ]; then
            ZIP_FILE="./hm-studio-app-v5-complete-root.zip"
          elif [ -f "./hm-studio-app-v5-complete.zip" ]; then
            ZIP_FILE="./hm-studio-app-v5-complete.zip"
          else
            echo "ERROR: V5 ZIP was not found."
            echo ""
            echo "ZIP files in repository:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "V5 ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract V5 project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "EXTRACTING V5 PROJECT"
          echo "======================================"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo ""
          echo "Extracted project files:"
          find extracted -maxdepth 5 -type f -print | head -300

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "LOCATING ANDROID PROJECT"
          echo "======================================"

          SETTINGS_FILE=""

          if [ -f "extracted/settings.gradle" ]; then
            SETTINGS_FILE="extracted/settings.gradle"
          elif [ -f "extracted/settings.gradle.kts" ]; then
            SETTINGS_FILE="extracted/settings.gradle.kts"
          else
            SETTINGS_FILE="$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1 || true)"
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle was not found."
            echo ""
            echo "Gradle files found:"
            find extracted -type f \( \
              -name "gradlew" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
            ) -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "ANDROID PROJECT CHECK"
          echo "======================================"

          echo "Current directory:"
          pwd

          echo ""
          echo "Root files:"
          ls -la

          echo ""
          echo "App files:"
          find app -maxdepth 3 -type f -print | head -200

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING ANDROID APK"
          echo "======================================"

          echo "Project:"
          pwd

          echo ""
          echo "Gradle version:"
          gradle --version

          echo ""
          echo "Starting build..."
          echo ""

          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR GENERATED APK"
          echo "======================================"

          echo ""
          echo "Build directories:"
          find "$PROJECT_DIR" -type d -name "build" -print || true

          echo ""
          echo "APK files:"
          find "$PROJECT_DIR" -type f -name "*.apk" -print || true

          APK_FILE="$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/debug/*.apk" | head -1 || true)"

          if [ -z "$APK_FILE" ]; then
            echo ""
            echo "ERROR: APK was not generated."

            echo ""
            echo "Gradle output files:"
            find "$PROJECT_DIR" -type f -path "*/build/outputs/*" -print || true

            exit 1
          fi

          echo ""
          echo "======================================"
          echo "APK FOUND"
          echo "======================================"

          echo "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK_FILE" "$GITHUB_WORKSPACE/apk-output/hm-studio-app-v5-debug.apk"

          echo ""
          echo "APK successfully copied:"
          ls -lh "$GITHUB_WORKSPACE/apk-output/hm-studio-app-v5-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hm-studio-app-v5-debug
          path: apk-output/hm-studio-app-v5-debug.apk
          if-no-files-found: error
