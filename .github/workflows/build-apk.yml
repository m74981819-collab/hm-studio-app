name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unzip Project if Needed
        run: |
          if [ -f "android_source_for_github.zip" ]; then
            echo "Unzipping android_source_for_github.zip..."
            unzip -o -q android_source_for_github.zip
          fi

      - name: Find Android Project and Build APK
        run: |
          SETTINGS_FILE=$(find . -name "settings.gradle" -not -path "*/.*" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle not found, building from root..."
            gradle assembleDebug --stacktrace --no-daemon
          else
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            echo "Found Android project at: $PROJECT_DIR"
            cd "$PROJECT_DIR"
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HM-Studio-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/*.apk
          if-no-files-found: error
