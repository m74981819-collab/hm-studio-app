     name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract source and prepare Gradle
        run: |
          # اگر فایل زیپ وجود دارد اکسترکت شود
          if [ -f "android_source_for_github.zip" ]; then
            unzip -o android_source_for_github.zip
          fi
          
          # پیدا کردن مسیر دقیق gradlew
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::gradlew not found!"
            exit 1
          fi
          
          PROJECT_ROOT=$(dirname "$GRADLEW_PATH")
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV
          chmod +x "$GRADLEW_PATH"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_ROOT"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HM-Studio-App-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/*.apk
          if-no-files-found: error
