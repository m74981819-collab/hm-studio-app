name: Build Android APK V4

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK V4
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find V4 ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR V4 ZIP"
          echo "======================================"

          ZIP_FILE="$(find . -maxdepth 1 -type f \
            -name 'hm-studio-app-v4-professional-fixed*.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: V4 ZIP NOT FOUND"

            echo ""
            echo "ZIP FILES FOUND:"
            find . -maxdepth 1 -type f -name "*.zip" -print

            exit 1
          fi

          echo "V4 ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract V4 Project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          echo "======================================"
          echo "EXTRACTING V4 PROJECT"
          echo "======================================"

          unzip -q -o "$ZIP_FILE" -d extracted

          echo ""
          echo "EXTRACTED FILES:"
          find extracted -maxdepth 6 -type f | sort

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "LOCATING ANDROID PROJECT"
          echo "======================================"

          PROJECT_DIR=""

          if [ -f "extracted/settings.gradle" ] && \
             [ -f "extracted/app/build.gradle" ]; then
            PROJECT_DIR="extracted"
          else
            SETTINGS_FILE="$(find extracted -type f \
              -name "settings.gradle" \
              -print -quit)"

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found."

            echo ""
            echo "Gradle files:"
            find extracted -type f \
              \( -name "settings.gradle" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \) \
              -print

            exit 1
          fi

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Android Project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CHECKING ANDROID PROJECT"
          echo "======================================"

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "Android project structure is valid."
            - name: Fix MainActivity.java
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_DIR/app/src/main/java/com/hmstudio/app/MainActivity.java"

          echo "======================================"
          echo "CHECKING MAINACTIVITY.JAVA"
          echo "======================================"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: MainActivity.java not found:"
            echo "$FILE"
            exit 1
          fi

          echo "Fixing malformed closed string..."

          python3 - "$FILE" <<'PY'
import sys

path = sys.argv[1]

with open(path, "r", encoding="utf-8") as f:
    lines = f.readlines()

# Current broken line is line 243.
# Replace it safely with valid Java.
if len(lines) >= 243:
    lines[242] = '                if (!"closed".equals(value)) {\n'

with open(path, "w", encoding="utf-8") as f:
    f.writelines(lines)

print("MainActivity.java fixed.")

# Verify the corrected line.
with open(path, "r", encoding="utf-8") as f:
    check = f.readlines()

print("Line 243:")
print(check[242].rstrip())
PY

          echo ""
          echo "MainActivity.java correction completed."
          
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING DEBUG APK"
          echo "======================================"

          echo "Gradle version:"
          gradle --version

          echo ""
          echo "Starting Gradle build..."

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

          echo ""
          echo "======================================"
          echo "GRADLE BUILD FINISHED"
          echo "======================================"

      - name: Show Build Output
        shell: bash
        run: |
          echo "======================================"
          echo "BUILD OUTPUT"
          echo "======================================"

          echo ""
          echo "APK FILES:"
          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print || true

          echo ""
          echo "BUILD DIRECTORIES:"
          find "$PROJECT_DIR" \
            -type d \
            -name "build" \
            -print || true

      - name: Find Generated APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR GENERATED APK"
          echo "======================================"

          APK_FILE="$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo ""
            echo "ERROR: APK WAS NOT GENERATED."

            echo ""
            echo "FILES UNDER PROJECT:"
            find "$PROJECT_DIR" -type f | sort

            echo ""
            echo "FILES UNDER APP/BUILD:"
            find "$PROJECT_DIR/app/build" \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK_FILE"

          mkdir -p artifact

          cp "$APK_FILE" \
            artifact/HM-Studio-V4-debug.apk

          echo ""
          echo "FINAL APK:"
          ls -lh artifact/HM-Studio-V4-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HM-Studio-V4-APK
          path: artifact/HM-Studio-V4-debug.apk
          if-no-files-found: error
          retention-days: 14
