name: Build Android APK V3

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find V3 ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "SEARCHING FOR V3 ZIP"
          echo "======================================"

          ZIP_FILE=""

          for f in ./*.zip; do
            if [ -f "$f" ]; then
              NAME="$(basename "$f")"

              if [ "$NAME" = "hm-studio-app-v3-corrected.zip" ]; then
                ZIP_FILE="$f"
                break
              fi
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: hm-studio-app-v3-corrected.zip was not found."
            echo ""
            echo "ZIP files currently in repository:"
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          echo "FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract V3 Project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -q -o "$ZIP_FILE" -d extracted

          echo ""
          echo "Checking Android project..."

          test -f extracted/settings.gradle
          test -f extracted/build.gradle
          test -f extracted/app/build.gradle
          test -f extracted/app/src/main/AndroidManifest.xml

          echo "Android project detected."

      - name: Show Project Structure
        shell: bash
        run: |
          echo "======================================"
          echo "PROJECT STRUCTURE"
          echo "======================================"

          find extracted -maxdepth 5 -type f | sort

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILDING DEBUG APK"
          echo "======================================"

          cd extracted

          echo "Gradle version:"
          gradle --version

          echo ""
          echo "Running assembleDebug..."

          gradle \
            --no-daemon \
            --stacktrace \
            --console=plain \
            :app:assembleDebug

          echo ""
          echo "Gradle assembleDebug finished."

          echo ""
          echo "Searching build directories..."

          find . -type d -name build -print

          echo ""
          echo "Searching APK files..."

          find . -type f -name "*.apk" -print

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "VERIFYING APK"
          echo "======================================"

          APK_FILE="$(find extracted -type f -name "*.apk" -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo ""
            echo "ERROR: APK was NOT generated."
            echo ""
            echo "All files under app/build:"
            find extracted/app/build -type f -print 2>/dev/null || true
            echo ""
            echo "Gradle project directories:"
            find extracted -type d -maxdepth 6 | sort
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK_FILE"

          mkdir -p artifact

          cp "$APK_FILE" artifact/HM-Studio-V3-debug.apk

          ls -lh artifact/HM-Studio-V3-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HM-Studio-V3-APK
          path: artifact/HM-Studio-V3-debug.apk
          if-no-files-found: error
          retention-days: 14
