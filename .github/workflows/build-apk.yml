name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find fixed Android ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "hm-studio-app-fixed.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: hm-studio-app-fixed.zip was not found."
            echo "ZIP files currently in repository:"
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Using: $ZIP_FILE"

          mkdir -p android-project
          unzip -q "$ZIP_FILE" -d android-project

          echo "Checking source..."

          if grep -R "getWindow().setBackgroundColor" -n android-project; then
            echo "ERROR: Old broken source was found."
            exit 1
          fi

          echo "Corrected source confirmed."

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - name: Build Debug APK
        working-directory: android-project
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          find android-project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HM-Studio-App-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
