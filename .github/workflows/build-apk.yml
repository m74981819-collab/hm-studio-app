name: Build Android APK V5

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HM Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find existing V5 ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "FINDING EXISTING V5 ZIP"
          echo "======================================"

          ZIP_FILE=$(ls hm-studio-app-v5*.zip 2>/dev/null | head -n 1 || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Existing V5 ZIP was not found."
            echo ""
            echo "ZIP files:"
            ls -la *.zip 2>/dev/null || true
            exit 1
          fi

          echo "Using existing ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract existing project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "EXTRACTING EXISTING PROJECT"
          echo "======================================"

          rm -rf extracted
          mkdir extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo ""
          echo "Project files:"
          find extracted -maxdepth 5 -type f -print | head -300

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "LOCATING ANDROID PROJECT"
          echo "======================================"

          SETTINGS_FILE=$(find extracted -type f -name 'settings.gradle' -print -quit || true)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find extracted -type f -name 'settings.gradle.kts' -print -quit || true)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android settings file was not found."
            echo ""
            echo "Gradle files:"
            find extracted -type f -name 'gradlew' -print || true
            find extracted -type f -name 'settings.gradle' -print || true
            find extracted -type f -name 'settings.gradle.kts' -print || true
            find extracted -type f -name 'build.gradle' -print || true
            find extracted -type f -name 'build.gradle.kts' -print || true
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Android APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING ANDROID APK"
          echo "======================================"

          echo "Project:"
          pwd

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Starting build..."

          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "FINDING GENERATED APK"
          echo "======================================"

          APK_FILE=$(find "$PROJECT_DIR" -type f -name '*.apk' -print -quit || true)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            echo "Build output:"
            find "$PROJECT_DIR" -type f -path '*/build/outputs/*' -print || true
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK_FILE" "$GITHUB_WORKSPACE/apk-output/hm-studio-app-v5-debug.apk"

          echo ""
          echo "APK ready:"
          ls -lh "$GITHUB_WORKSPACE/apk-output/hm-studio-app-v5-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hm-studio-app-v5-debug
          path: apk-output/hm-studio-app-v5-debug.apk
          if-no-files-found: error
