name: Build Android APK V4

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK V4
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show repository files
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "REPOSITORY FILES"
          echo "======================================"

          pwd

          echo ""
          echo "ZIP FILES:"
          find . -type f -name "*.zip" -print || true

          echo ""
          echo "GRADLE FILES:"
          find . -type f \( \
            -name "gradlew" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
          \) -print || true

      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "FINDING PROJECT ZIP"
          echo "======================================"

          ZIP_FILE=""

          ZIP_FILE="$(find . -maxdepth 2 -type f -name "hm-studio-app-v4*.zip" | head -1 || true)"

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 2 -type f -name "*.zip" | head -1 || true)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file was found in the repository."
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "EXTRACTING PROJECT"
          echo "======================================"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo ""
          echo "EXTRACTED FILES:"
          find extracted -maxdepth 6 -type f -print | head -400

      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "FINDING GRADLE PROJECT"
          echo "======================================"

          GRADLEW_FILE="$(find extracted -type f -name "gradlew" | head -1 || true)"

          if [ -z "$GRADLEW_FILE" ]; then
            echo "ERROR: gradlew was not found."
            echo ""
            echo "All Gradle-related files:"
            find extracted -type f \( \
              -name "gradlew" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
            \) -print || true
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW_FILE")"

          echo "gradlew:"
          echo "$GRADLEW_FILE"

          echo ""
          echo "PROJECT DIRECTORY:"
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "WARNING: settings.gradle was not found directly in project directory."
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "PREPARING GRADLE"
          echo "======================================"

          chmod +x ./gradlew

          echo ""
          echo "Gradle version:"
          ./gradlew --version

      - name: Build Android APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "STARTING ANDROID BUILD"
          echo "======================================"

          echo ""
          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          find . -maxdepth 3 -type f -print | head -300

          echo ""
          echo "Running Gradle..."
          echo ""

          ./gradlew assembleDebug --no-daemon --stacktrace

          echo ""
          echo "======================================"
          echo "GRADLE BUILD FINISHED"
          echo "======================================"

      - name: Search for APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          echo ""
          echo "All build directories:"
          find "$PROJECT_DIR" -type d -name "build" -print || true

          echo ""
          echo "All APK files:"
          find "$PROJECT_DIR" -type f -name "*.apk" -print || true

          APK_FILE="$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/debug/*.apk" | head -1 || true)"

          if [ -z "$APK_FILE" ]; then
            echo ""
            echo "ERROR: APK was not generated."
            echo ""
            echo "Checking Gradle output directories:"
            find "$PROJECT_DIR" -type d -path "*/build/outputs/*" -print || true
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "APK FOUND"
          echo "======================================"

          echo "$APK_FILE"

          mkdir -p apk-output

          cp "$APK_FILE" "apk-output/hm-studio-app-v4-debug.apk"

          echo ""
          echo "APK copied successfully:"
          ls -lh "apk-output/hm-studio-app-v4-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hm-studio-app-v4-debug
          path: apk-output/hm-studio-app-v4-debug.apk
          if-no-files-found: error
