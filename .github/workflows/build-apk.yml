name: Build HM Studio APK V6

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HM Studio APK V6
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find V6 ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "FINDING V6 PROJECT ZIP"
          echo "======================================"

          ZIP_FILE="hm-studio-app-v6-corrected.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found."
            echo ""
            echo "ZIP files currently in repository:"
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          echo "V6 ZIP found:"
          ls -lh "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract V6 project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "EXTRACTING V6 PROJECT"
          echo "======================================"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo ""
          echo "Extracted files:"
          find extracted -maxdepth 4 -type f -print | head -300

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "LOCATING ANDROID PROJECT"
          echo "======================================"

          PROJECT_DIR=""

          SETTINGS_FILE=$(find extracted -type f -name "settings.gradle" -print -quit || true)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find extracted -type f -name "settings.gradle.kts" -print -quit || true)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle was not found."
            echo ""
            echo "Available Gradle files:"
            find extracted -type f \
              \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "PREPARING GRADLE"
          echo "======================================"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found."
            ./gradlew --version
          else
            echo "Gradle wrapper not found."
            echo "Using GitHub Actions Gradle installation."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING HM STUDIO APK"
          echo "======================================"

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          APK_FILE=$(find "$PROJECT_DIR" -type f -name "*.apk" -print -quit || true)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            echo "Build output directories:"
            find "$PROJECT_DIR" -type d -path "*/build/*" -print | head -200 || true
            echo ""
            echo "APK files:"
            find "$PROJECT_DIR" -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK_FILE" "$GITHUB_WORKSPACE/apk-output/hm-studio-app-v6-debug.apk"

          echo ""
          echo "Final APK:"
          ls -lh "$GITHUB_WORKSPACE/apk-output/hm-studio-app-v6-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hm-studio-app-v6-debug
          path: apk-output/hm-studio-app-v6-debug.apk
          if-no-files-found: error
