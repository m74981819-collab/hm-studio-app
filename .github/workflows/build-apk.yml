name: Build Android APK V2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Find V2 ZIP
        shell: bash
        run: |
          echo "Files in repository:"
          find . -maxdepth 2 -type f -print

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*v2*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: V2 ZIP file was not found."
            echo "Available ZIP files:"
            find . -type f -iname '*.zip' -print
            exit 1
          fi

          echo "Found V2 ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Prepare Android project
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted

          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | head -200

      - name: Find Gradle project
        shell: bash
        run: |
          PROJECT_DIR="$(find extracted -type f -name 'gradlew' -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project was not found."
            echo "Searching for settings.gradle:"
            find extracted -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        shell: bash
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "Searching for APK..."
          find "$PROJECT_DIR" -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HM-Studio-App-V2-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
