name: Build Android APK V5

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HM Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "FINDING PROJECT ZIP"
          echo "======================================"

          ZIP_FILE=""

          if [ -f "hm-studio-app-v5-final.zip" ]; then
            ZIP_FILE="hm-studio-app-v5-final.zip"
          fi

          if [ -z "$ZIP_FILE" ] && [ -f "hm-studio-app-v5-complete-root.zip" ]; then
            ZIP_FILE="hm-studio-app-v5-complete-root.zip"
          fi

          if [ -z "$ZIP_FILE" ] && [ -f "hm-studio-app-v5-complete.zip" ]; then
            ZIP_FILE="hm-studio-app-v5-complete.zip"
          fi

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 1 -type f -iname 'hm-studio-app*.zip' -print -quit || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No HM Studio ZIP file was found."
            echo ""
            echo "Files in repository:"
            find . -maxdepth 2 -type f -print | sort
            exit 1
          fi

          echo "Using project ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "EXTRACTING PROJECT"
          echo "======================================"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo ""
          echo "Extracted project files:"
          find extracted -maxdepth 6 -type f -print | head -400

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "LOCATING ANDROID PROJECT"
          echo "======================================"

          PROJECT_DIR=""

          SETTINGS_FILE=$(find extracted \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit || true)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            GRADLE_FILE=$(find extracted \
              -type f \
              -name "build.gradle" \
              -print -quit || true)

            if [ -n "$GRADLE_FILE" ]; then
              PROJECT_DIR=$(dirname "$GRADLE_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project was not found."

            echo ""
            echo "Gradle files found:"
            find extracted -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print || true

            exit 1
          fi

          echo "Android project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "CHECKING ANDROID PROJECT"
          echo "======================================"

          echo "Current directory:"
          pwd

          echo ""
          echo "Project contents:"
          ls -la

          echo ""
          echo "App module:"
          if [ -d "app" ]; then
            ls -la app
          else
            echo "WARNING: app directory was not found."
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING DEBUG APK"
          echo "======================================"

          echo "Gradle version:"
          gradle --version

          echo ""
          echo "Running Gradle..."

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR GENERATED APK"
          echo "======================================"

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print -quit || true)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Checking build directories:"
            find "$PROJECT_DIR" \
              -type d \
              -name "build" \
              -print || true

            echo ""
            echo "Checking APK output directories:"
            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/*" \
              -print || true

            echo ""
            echo "All APK files:"
            find . \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "======================================"
          echo "APK FOUND"
          echo "======================================"

          echo "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/apk-output/hm-studio-app-v5-debug.apk"

          echo ""
          echo "Final APK:"
          ls -lh \
            "$GITHUB_WORKSPACE/apk-output/hm-studio-app-v5-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hm-studio-app-v5-debug
          path: apk-output/hm-studio-app-v5-debug.apk
          if-no-files-found: error
