name: HM Studio V6 Stable APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract V6
        shell: bash
        run: |
          set -e

          ZIP="$(find . -type f -name 'hm-studio-app-v6-corrected.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: hm-studio-app-v6-corrected.zip NOT FOUND"
            exit 1
          fi

          rm -rf v6-project
          mkdir -p v6-project

          unzip -q "$ZIP" -d v6-project

          PROJECT="$(find v6-project -type f -name 'settings.gradle' -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: settings.gradle NOT FOUND"
            find v6-project -maxdepth 5 -type f | sort | head -100
            exit 1
          fi

          if [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle NOT FOUND"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "================================"
          echo "V6 PROJECT FOUND"
          echo "$PROJECT"
          echo "================================"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check project
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          echo "Gradle:"
          gradle --version

          echo "Android project:"
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "PROJECT CHECK OK"

      - name: Create mobile stability JS
        shell: bash
        run: |
          set -e

          mkdir -p "$PROJECT/app/src/main/assets/js"

          echo '[0],function(){location.href="https://wa.me/"+phone+"?text="+encodeURIComponent(m)});b(lab[1],function(){location.href="sms:"+phone+"?body="+encodeURIComponent(m)});b(lab[2],function(){location.href="https://t.me/share/url?url=&text="+encodeURIComponent(m)});b(lab[3],function(){location.href="mailto:"+mail+"?subject="+encodeURIComponent("HM Studio Project Request")+"&body="+encodeURIComponent(m)});a.scrollIntoView({behavior:"smooth",block:"nearest"})})}function boot(){layers();order();clock();setInterval(clock,1000)}document.readyState==="loading"?document.addEventListener("DOMContentLoaded",boot,{once:true}):boot()})();' | base64 -d > "$PROJECT/app/src/main/assets/js/hm-v6-stability.js"

          test -s "$PROJECT/app/src/main/assets/js/hm-v6-stability.js"

      - name: Create mobile stability CSS
        shell: bash
        run: |
          set -e

          mkdir -p "$PROJECT/app/src/main/assets/css"

          echo '' | base64 -d > "$PROJECT/app/src/main/assets/css/hm-v6-stability.css"

          test -s "$PROJECT/app/src/main/assets/css/hm-v6-stability.css"

      - name: Attach stability files
        shell: bash
        run: |
          set -e

          INDEX="$PROJECT/app/src/main/assets/index.html"

          test -f "$INDEX"

          python3 -c "from pathlib import Path; p=Path('$INDEX'); s=p.read_text(encoding='utf-8'); s=s.replace('hm-v6-stability.css','hm-v6-stability.css') if 'hm-v6-stability.css' in s else s.replace('</head>','<link rel=\"stylesheet\" href=\"css/hm-v6-stability.css\">\\n</head>',1); s=s.replace('hm-v6-stability.js','hm-v6-stability.js') if 'hm-v6-stability.js' in s else s.replace('</body>','<script src=\"js/hm-v6-stability.js\"></script>\\n</body>',1); p.write_text(s,encoding='utf-8')"

          grep -q "hm-v6-stability.css" "$INDEX"
          grep -q "hm-v6-stability.js" "$INDEX"

          echo "STABILITY PATCH ATTACHED"

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          echo "========================================"
          echo "BUILDING HM STUDIO V6"
          echo "========================================"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$(find "$PROJECT/app/build/outputs/apk" -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "========================================"
            echo "ERROR: APK WAS NOT GENERATED"
            echo "========================================"

            find "$PROJECT/app/build" -type f -print | sort || true

            exit 1
          fi

          echo "========================================"
          echo "APK FOUND"
          echo "========================================"
          echo "$APK"

          mkdir -p apk-output

          cp "$APK" apk-output/hm-studio-v6-stable-debug.apk

          test -s apk-output/hm-studio-v6-stable-debug.apk

          ls -lh apk-output/hm-studio-v6-stable-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hm-studio-v6-stable-debug
          path: apk-output/hm-studio-v6-stable-debug.apk
          if-no-files-found: error
          retention-days: 14
