name: HM Studio V6 RESTORE CLEAN

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Find V6
        shell: bash
        run: |
          set -e

          ZIP="$(find . \
            -type f \
            -name 'hm-studio-app-v6-corrected.zip' \
            -print \
            | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: V6 ZIP NOT FOUND"
            find . -type f -name "*.zip" -print
            exit 1
          fi

          echo "ZIP=$ZIP"
          echo "V6_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract V6
        shell: bash
        run: |
          set -e

          rm -rf v6
          mkdir v6

          unzip -q "$V6_ZIP" -d v6

          PROJECT="$(find v6 \
            -type f \
            -name settings.gradle \
            -print \
            | head -n 1 \
            | xargs -r dirname)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT/app/src/main/assets/index.html"

          echo "V6 CLEAN PROJECT FOUND:"
          echo "$PROJECT"

      - name: Verify Original V6
        shell: bash
        run: |
          set -e

          test -f \
            "$PROJECT/app/src/main/assets/assets/images/hossein-hero.png"

          test -f \
            "$PROJECT/app/src/main/assets/assets/audio/ambient.mp3"

          test -f \
            "$PROJECT/app/src/main/assets/assets/video/hossein-brand-film.mp4"

          echo "Original V6 assets OK"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build Original V6
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$(find \
            "$PROJECT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK NOT FOUND"

            find \
              "$PROJECT/app/build" \
              -maxdepth 10 \
              -type f \
              -print || true

            exit 1
          fi

          mkdir -p release

          cp "$APK" \
            release/HM-Studio-V6-CLEAN.apk

          echo "================================"
          echo "CLEAN V6 APK READY"
          echo "================================"

          ls -lh release/HM-Studio-V6-CLEAN.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HM-Studio-V6-CLEAN
          path: release/HM-Studio-V6-CLEAN.apk
          if-no-files-found: error
