name: Build HM Studio APK V6

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build HM Studio APK V6
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find V6 ZIP
        run: |
          set -e

          test -f hm-studio-app-v6-corrected.zip

          echo "V6 ZIP:"
          ls -lh hm-studio-app-v6-corrected.zip

      - name: Extract V6
        run: |
          set -e

          rm -rf extracted
          mkdir extracted

          unzip -o hm-studio-app-v6-corrected.zip -d extracted

          echo "Extracted:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Find Android project
        run: |
          set -e

          PROJECT=$(find extracted -type f -name gradlew -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "gradlew not found"

            SETTINGS=$(find extracted -type f -name settings.gradle -print -quit)

            if [ -z "$SETTINGS" ]; then
              SETTINGS=$(find extracted -type f -name settings.gradle.kts -print -quit)
            fi

            if [ -z "$SETTINGS" ]; then
              echo "Android project not found"
              exit 1
            fi

            PROJECT=$(dirname "$SETTINGS")
          else
            PROJECT=$(dirname "$PROJECT")
          fi

          echo "PROJECT=$PROJECT"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          set -e
          set -x

          cd "$PROJECT"

          echo "======================================"
          echo "BUILDING HM STUDIO APK"
          echo "======================================"

          pwd
          ls -la

          chmod +x gradlew

          ./gradlew clean assembleDebug --no-daemon --stacktrace

          echo "======================================"
          echo "BUILD FINISHED"
          echo "======================================"

          find . -type f -name "*.apk" -print

      - name: Copy APK
        run: |
          set -e

          APK=$(find "$PROJECT" -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK NOT FOUND"
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          mkdir -p apk-output

          cp "$APK" apk-output/hm-studio-app-v6-debug.apk

          ls -lh apk-output/hm-studio-app-v6-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hm-studio-app-v6-debug
          path: apk-output/hm-studio-app-v6-debug.apk
          if-no-files-found: error
