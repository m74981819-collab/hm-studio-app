name: HM Studio V6 Stable APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract V6
        shell: bash
        run: |
          set -e

          ZIP="$(find . -type f -name 'hm-studio-app-v6-corrected.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: V6 ZIP NOT FOUND"
            find . -type f -name '*.zip' -print
            exit 1
          fi

          rm -rf v6-project
          mkdir -p v6-project

          unzip -q "$ZIP" -d v6-project

          PROJECT="$(find v6-project -type f -name 'settings.gradle' -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project NOT FOUND"
            exit 1
          fi

          test -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT/app/src/main/assets/index.html"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "PROJECT=$PROJECT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          gradle --version

          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "ANDROID PROJECT OK"

      - name: Create Stable Clock and Features JS
        shell: bash
        run: |
          set -e

          FILE="$PROJECT/app/src/main/assets/js/stable-ui.js"

          mkdir -p "$(dirname "$FILE")"

          printf '%s\n' \
          '(function(){' \
          '"use strict";' \
          '' \
          'function getLanguage(){' \
          'var l=(document.documentElement.lang||"").toLowerCase();' \
          'if(l.indexOf("ar")===0)return "ar";' \
          'if(l.indexOf("en")===0)return "en";' \
          'return "fa";' \
          '}' \
          '' \
          'function labels(){' \
          'var l=getLanguage();' \
          'if(l==="en")return {date:"Date",time:"Time",features:"Features"};' \
          'if(l==="ar")return {date:"التاريخ",time:"الوقت",features:"الميزات"};' \
          'return {date:"تاریخ",time:"ساعت",features:"امکانات"};' \
          '}' \
          '' \
          'function makeClock(){' \
          'var box=document.getElementById("hm-stable-clock");' \
          'if(!box){' \
          'box=document.createElement("div");' \
          'box.id="hm-stable-clock";' \
          'box.setAttribute("dir","auto");' \
          'document.body.appendChild(box);' \
          '}' \
          'return box;' \
          '}' \
          '' \
          'function updateClock(){' \
          'var box=makeClock();' \
          'var l=getLanguage();' \
          'var x=labels();' \
          'var d=new Date();' \
          'var time=d.toLocaleTimeString(l==="fa"?"fa-IR":l==="ar"?"ar":"en-US",{hour:"2-digit",minute:"2-digit",hour12:false});' \
          'var date=d.toLocaleDateString(l==="fa"?"fa-IR":l==="ar"?"ar":"en-US",{year:"numeric",month:"long",day:"numeric"});' \
          'box.innerHTML="<div class=\"hm-clock-row\"><span>"+x.date+"</span><strong>"+date+"</strong></div><div class=\"hm-clock-row\"><span>"+x.time+"</span><strong>"+time+"</strong></div>";' \
          'box.classList.add("hm-clock-visible");' \
          '}' \
          '' \
          'function restoreFeatures(){' \
          'var names=/^(امکانات|features|الميزات)$/i;' \
          'var found=false;' \
          'document.querySelectorAll("a,button,[role=button],li,div,span").forEach(function(e){' \
          'if(e.children.length>2)return;' \
          'var t=String(e.textContent||"").replace(/\\s+/g," ").trim();' \
          'if(!names.test(t))return;' \
          'found=true;' \
          'e.style.removeProperty("display");' \
          'e.style.removeProperty("visibility");' \
          'e.style.removeProperty("opacity");' \
          'e.classList.add("hm-features-visible");' \
          '});' \
          'if(found)return;' \
          'var nav=document.querySelector("nav");' \
          'if(!nav)nav=document.querySelector(".bottom-nav,.bottom-navigation,.footer-nav,.mobile-nav");' \
          'if(!nav)return;' \
          'var b=document.createElement("button");' \
          'b.type="button";' \
          'b.id="hm-features-button";' \
          'b.textContent=labels().features;' \
          'b.addEventListener("click",function(){' \
          'var target=document.querySelector("[data-features],#features,.features, .features-section");' \
          'if(target)target.scrollIntoView({behavior:"smooth",block:"start"});' \
          '});' \
          'nav.appendChild(b);' \
          '}' \
          '' \
          'function stabilize(){' \
          'document.querySelectorAll("*").forEach(function(e){' \
          'var c=String(e.className||"")+" "+String(e.id||"");' \
          'if(/clock|time|date|datetime/i.test(c)){e.style.animation="none";e.style.transition="none";}' \
          '});' \
          '}' \
          '' \
          'function start(){' \
          'updateClock();' \
          'restoreFeatures();' \
          'stabilize();' \
          'setInterval(updateClock,1000);' \
          'setInterval(restoreFeatures,2000);' \
          'setInterval(stabilize,3000);' \
          '}' \
          '' \
          'if(document.readyState==="loading"){' \
          'document.addEventListener("DOMContentLoaded",start);' \
          '}else{' \
          'start();' \
          '}' \
          '})();' \
          > "$FILE"

          test -s "$FILE"

          echo "STABLE UI JS CREATED"

      - name: Create Stable Clock and Features CSS
        shell: bash
        run: |
          set -e

          FILE="$PROJECT/app/src/main/assets/css/stable-ui.css"

          mkdir -p "$(dirname "$FILE")"

          printf '%s\n' \
          '#hm-stable-clock{' \
          'position:relative;' \
          'z-index:50;' \
          'display:block;' \
          'width:calc(100% - 28px);' \
          'max-width:520px;' \
          'margin:12px auto 18px;' \
          'padding:12px 14px;' \
          'box-sizing:border-box;' \
          'border:1px solid rgba(255,255,255,.16);' \
          'border-radius:16px;' \
          'background:rgba(5,15,25,.82);' \
          'backdrop-filter:blur(12px);' \
          '-webkit-backdrop-filter:blur(12px);' \
          'box-shadow:0 8px 25px rgba(0,0,0,.24);' \
          'color:#fff;' \
          'font-family:inherit;' \
          'opacity:1!important;' \
          'visibility:visible!important;' \
          'animation:none!important;' \
          'transition:none!important;' \
          'transform:none!important;' \
          '}' \
          '' \
          '#hm-stable-clock .hm-clock-row{' \
          'display:flex;' \
          'align-items:center;' \
          'justify-content:space-between;' \
          'gap:12px;' \
          'min-height:28px;' \
          'line-height:1.4;' \
          '}' \
          '' \
          '#hm-stable-clock .hm-clock-row span{' \
          'font-size:12px;' \
          'opacity:.7;' \
          'white-space:nowrap;' \
          '}' \
          '' \
          '#hm-stable-clock .hm-clock-row strong{' \
          'font-size:14px;' \
          'font-weight:700;' \
          'text-align:end;' \
          'white-space:nowrap;' \
          '}' \
          '' \
          '.hm-features-visible{' \
          'display:flex!important;' \
          'visibility:visible!important;' \
          'opacity:1!important;' \
          'pointer-events:auto!important;' \
          'position:relative;' \
          'z-index:100;' \
          '}' \
          '' \
          '#hm-features-button{' \
          'display:flex;' \
          'align-items:center;' \
          'justify-content:center;' \
          'min-width:74px;' \
          'min-height:42px;' \
          'padding:7px 10px;' \
          'margin:4px;' \
          'border:1px solid rgba(255,255,255,.18);' \
          'border-radius:12px;' \
          'background:rgba(10,20,30,.82);' \
          'color:#fff;' \
          'font-family:inherit;' \
          'font-size:12px;' \
          'font-weight:700;' \
          'white-space:nowrap;' \
          'z-index:1000;' \
          '}' \
          '' \
          '#hm-features-button:active{' \
          'transform:scale(.96);' \
          'box-shadow:0 0 16px rgba(255,45,45,.4);' \
          '}' \
          '' \
          '@media(max-width:480px){' \
          '#hm-stable-clock{' \
          'width:calc(100% - 20px);' \
          'margin:10px auto 14px;' \
          'padding:10px 12px;' \
          '}' \
          '#hm-stable-clock .hm-clock-row strong{' \
          'font-size:13px;' \
          '}' \
          '}' \
          > "$FILE"

          test -s "$FILE"

          echo "STABLE UI CSS CREATED"

      - name: Attach Stable UI
        shell: bash
        run: |
          set -e

          INDEX="$PROJECT/app/src/main/assets/index.html"

          python3 -c 'from pathlib import Path; p=Path("'"$INDEX"'"); s=p.read_text(encoding="utf-8"); css="<link rel=\"stylesheet\" href=\"css/stable-ui.css\">"; js="<script src=\"js/stable-ui.js\" defer></script>"; s=s if "stable-ui.css" in s else s.replace("</head>",css+"</head>"); s=s if "stable-ui.js" in s else s.replace("</body>",js+"</body>"); p.write_text(s,encoding="utf-8")'

          grep -q "stable-ui.css" "$INDEX"
          grep -q "stable-ui.js" "$INDEX"

          echo "STABLE UI ATTACHED"

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$(find "$PROJECT/app/build/outputs/apk" -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK NOT GENERATED"
            find "$PROJECT/app/build" -type f -print || true
            exit 1
          fi

          mkdir -p release

          cp "$APK" release/HM-Studio-V6-Stable.apk

          echo "APK GENERATED:"
          ls -lh release/HM-Studio-V6-Stable.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HM-Studio-V6-Stable-APK
          path: release/HM-Studio-V6-Stable.apk
          if-no-files-found: error
