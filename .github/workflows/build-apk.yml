name: Build Android APK V4

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK V4
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find V4 ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR V4 ZIP"
          echo "======================================"

          ZIP_FILE=""

          for file in \
            "hm-studio-app-v4-professional-fixed (1).zip" \
            "hm-studio-app-v4-professional-fixed.zip" \
            "hm-studio-app-v4-fixed-build.zip"
          do
            if [ -f "$file" ]; then
              ZIP_FILE="$file"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: V4 ZIP was not found."
            echo "Files in repository:"
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP contents:"
          unzip -l "$ZIP_FILE" | head -100

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract V4 Project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "======================================"
          echo "EXTRACTED FILES"
          echo "======================================"

          find extracted -maxdepth 5 -type f -print | head -300

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR ANDROID PROJECT"
          echo "======================================"

          PROJECT_DIR=""

          while IFS= read -r gradle_file; do
            DIR="$(dirname "$gradle_file")"

            if [ -f "$DIR/gradlew" ] && [ -f "$DIR/settings.gradle" -o -f "$DIR/settings.gradle.kts" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find extracted -type f -name "build.gradle" -o -name "build.gradle.kts")

          if [ -z "$PROJECT_DIR" ]; then
            if [ -f extracted/gradlew ] && [ -f extracted/settings.gradle ]; then
              PROJECT_DIR="extracted"
            elif [ -f extracted/gradlew ] && [ -f extracted/settings.gradle.kts ]; then
              PROJECT_DIR="extracted"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project was not found."
            echo ""
            echo "Searching for Gradle files:"
            find extracted -type f \( \
              -name "gradlew" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
            \) -print
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew was not found."
            exit 1
          fi

          chmod +x ./gradlew

          echo "Gradle wrapper:"
          ./gradlew --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING DEBUG APK"
          echo "======================================"

          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find Generated APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR GENERATED APK"
          echo "======================================"

          APK_FILE=""

          if [ -d "$PROJECT_DIR" ]; then
            APK_FILE="$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/debug/*.apk" | head -1)"
          fi

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            echo "Build directories:"
            find "$PROJECT_DIR" -type d -name build -print || true
            echo ""
            echo "APK-like files:"
            find "$PROJECT_DIR" -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK_FILE" "$GITHUB_WORKSPACE/apk-output/hm-studio-app-v4-debug.apk"

          echo "APK copied to:"
          echo "$GITHUB_WORKSPACE/apk-output/hm-studio-app-v4-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hm-studio-app-v4-debug
          path: apk-output/hm-studio-app-v4-debug.apk
          if-no-files-found: error
