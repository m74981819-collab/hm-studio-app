name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Locate and Prepare Android Project
        run: |
          # اگر فایل زیپ وجود دارد باز شود
          if [ -f "android_source_for_github.zip" ]; then
            python3 -c "import zipfile; zipfile.ZipFile('android_source_for_github.zip').extractall('.')"
          fi

          # پیدا کردن محل فایل gradlew
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          chmod +x "$GRADLEW_PATH"

      - name: Build with Gradle
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HM-Studio-App-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/*.apk
