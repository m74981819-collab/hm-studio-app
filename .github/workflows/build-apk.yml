name: Build Android APK V2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find V2 ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*v2*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: V2 ZIP file was not found."
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Found V2 ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract V2 project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted project:"
          find extracted -maxdepth 4 -type f | head -200

      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(find extracted -type f -name 'gradlew' -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew was not found."
            find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          APK_FILE="$(find "$PROJECT_DIR" -type f -name "*.apk" -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            echo "Build directory:"
            find "$PROJECT_DIR" -maxdepth 6 -type d -name "outputs" -print
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          mkdir -p artifact

          cp "$APK_FILE" artifact/app-debug.apk

          echo "Final artifact:"
          ls -lh artifact/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HM-Studio-App-V2-APK
          path: artifact/app-debug.apk
          if-no-files-found: error
