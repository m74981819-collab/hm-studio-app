name: HM Studio V6 Final APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract V6
        shell: bash
        run: |
          set -e

          ZIP="$(find . -type f -name 'hm-studio-app-v6-corrected.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: V6 ZIP NOT FOUND"
            find . -type f -name '*.zip' -print
            exit 1
          fi

          rm -rf v6-project
          mkdir -p v6-project

          unzip -q "$ZIP" -d v6-project

          PROJECT="$(find v6-project -type f -name 'settings.gradle' -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          test -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT/app/src/main/assets/index.html"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "PROJECT: $PROJECT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Project
        shell: bash
        run: |
          set -e
          cd "$PROJECT"

          gradle --version

          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "PROJECT OK"

      - name: Create Mobile JS
        shell: bash
        run: |
          set -e

          FILE="$PROJECT/app/src/main/assets/js/mobile-stability.js"

          mkdir -p "$(dirname "$FILE")"

          printf '%s\n' \
          '(function(){' \
          '"use strict";' \
          'function txt(e){return String(e&&e.textContent||"").replace(/\s+/g," ").trim();}' \
          'function getLinks(){' \
          'var wa="";' \
          'var mail="";' \
          'document.querySelectorAll("a[href]").forEach(function(a){' \
          'var h=a.getAttribute("href")||"";' \
          'if(!wa&&/wa\.me|whatsapp/i.test(h))wa=h;' \
          'if(!mail&&/^mailto:/i.test(h))mail=h.substring(7).split("?")[0];' \
          '});' \
          'return {wa:wa,mail:mail};' \
          '}' \
          'function values(root){' \
          'var out=[];' \
          'root.querySelectorAll("input,select,textarea").forEach(function(e){' \
          'if(e.disabled||e.type==="hidden")return;' \
          'var v=String(e.value||"").trim();' \
          'if(!v)return;' \
          'var n=e.getAttribute("aria-label")||e.getAttribute("name")||e.getAttribute("placeholder")||"اطلاعات";' \
          'out.push(n+": "+v);' \
          '});' \
          'return out.join("\n");' \
          '}' \
          'function sendPanel(message){' \
          'var old=document.getElementById("hm-send-panel");' \
          'if(old)old.remove();' \
          'var p=document.createElement("div");' \
          'p.id="hm-send-panel";' \
          'p.innerHTML="<div class=\"hm-send-title\">ارسال درخواست پروژه</div><div class=\"hm-send-text\">روش ارسال را انتخاب کنید</div><div class=\"hm-send-actions\"><button data-send=\"wa\">واتساپ</button><button data-send=\"sms\">پیامک</button><button data-send=\"mail\">ایمیل</button><button data-send=\"close\">بستن</button></div>";' \
          'document.body.appendChild(p);' \
          'var l=getLinks();' \
          'var encoded=encodeURIComponent(message);' \
          'p.addEventListener("click",function(e){' \
          'var b=e.target.closest("[data-send]");' \
          'if(!b)return;' \
          'var type=b.dataset.send;' \
          'if(type==="close"){p.remove();return;}' \
          'var url="";' \
          'if(type==="wa")url=l.wa?(l.wa+(l.wa.indexOf("?")>=0?"&":"?")+"text="+encoded):"https://api.whatsapp.com/send?text="+encoded;' \
          'if(type==="sms")url="sms:?body="+encoded;' \
          'if(type==="mail")url="mailto:"+(l.mail||"")+"?subject="+encodeURIComponent("درخواست پروژه HM Studio")+"&body="+encoded;' \
          'window.location.href=url;' \
          '});' \
          '}' \
          'function isOrderButton(e){' \
          'return /ارسال درخواست پروژه|درخواست پروژه|project request|send request/i.test(txt(e));' \
          '}' \
          'function music(){' \
          'document.querySelectorAll("button,a,[role=button]").forEach(function(b){' \
          'if(!/نصب اپلیکیشن|install app/i.test(txt(b)))return;' \
          'if(b.dataset.hmMusic)return;' \
          'b.dataset.hmMusic="1";' \
          'b.textContent="♪";' \
          'b.setAttribute("aria-label","آهنگ");' \
          'b.title="آهنگ";' \
          'b.addEventListener("click",function(e){' \
          'e.preventDefault();' \
          'e.stopPropagation();' \
          'if(!window.hmAudio){' \
          'window.hmAudio=new Audio("assets/audio/ambient.mp3");' \
          'window.hmAudio.loop=true;' \
          '}' \
          'if(window.hmAudio.paused){' \
          'window.hmAudio.play().catch(function(){});' \
          'b.classList.add("hm-playing");' \
          '}else{' \
          'window.hmAudio.pause();' \
          'b.classList.remove("hm-playing");' \
          '}' \
          '},true);' \
          '});' \
          '}' \
          'function orders(){' \
          'document.addEventListener("click",function(e){' \
          'var b=e.target.closest("button,a,[role=button]");' \
          'if(!b||!isOrderButton(b))return;' \
          'var root=b.closest("form")||document.body;' \
          'var data=values(root)||values(document.body);' \
          'e.preventDefault();' \
          'e.stopPropagation();' \
          'sendPanel("سلام\nدرخواست پروژه HM Studio\n\n"+data);' \
          '},true);' \
          'document.querySelectorAll("form").forEach(function(f){' \
          'f.addEventListener("submit",function(e){' \
          'var data=values(f);' \
          'if(/project|order|بودجه|نوع پروژه|توضیحات پروژه|درخواست/i.test(txt(f))){' \
          'e.preventDefault();' \
          'sendPanel("سلام\nدرخواست پروژه HM Studio\n\n"+data);' \
          '}' \
          '},true);' \
          '});' \
          '}' \
          'function stable(){' \
          'document.querySelectorAll("*").forEach(function(e){' \
          'if(e.children.length!==0)return;' \
          'var t=txt(e);' \
          'if(/\b\d{1,2}:\d{2}\b/.test(t)||/clock|time|date/i.test(String(e.className)+" "+e.id))e.classList.add("hm-stable-info");' \
          '});' \
          '}' \
          'function start(){' \
          'music();' \
          'orders();' \
          'stable();' \
          'setInterval(stable,1500);' \
          '}' \
          'if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start);else start();' \
          '})();' \
          > "$FILE"

          test -s "$FILE"

          echo "JS CREATED"

      - name: Create Mobile CSS
        shell: bash
        run: |
          set -e

          FILE="$PROJECT/app/src/main/assets/css/mobile-stability.css"

          mkdir -p "$(dirname "$FILE")"

          printf '%s\n' \
          '#hm-send-panel{' \
          'position:fixed;' \
          'left:14px;' \
          'right:14px;' \
          'bottom:88px;' \
          'z-index:2147483647;' \
          'padding:18px;' \
          'border:1px solid rgba(80,190,255,.4);' \
          'border-radius:22px;' \
          'background:rgba(3,18,31,.98);' \
          'box-shadow:0 18px 50px rgba(0,0,0,.45);' \
          'color:#fff;' \
          'text-align:center;' \
          'font-family:inherit;' \
          '}' \
          '#hm-send-panel .hm-send-title{' \
          'font-size:20px;' \
          'font-weight:800;' \
          'margin-bottom:8px;' \
          '}' \
          '#hm-send-panel .hm-send-text{' \
          'opacity:.8;' \
          'margin-bottom:14px;' \
          '}' \
          '.hm-send-actions{' \
          'display:grid;' \
          'grid-template-columns:1fr 1fr;' \
          'gap:10px;' \
          '}' \
          '.hm-send-actions button{' \
          'min-height:52px;' \
          'border:1px solid rgba(80,190,255,.4);' \
          'border-radius:15px;' \
          'background:#071c2d;' \
          'color:#fff;' \
          'font:inherit;' \
          'font-weight:700;' \
          '}' \
          '.hm-send-actions button:active{' \
          'transform:scale(.97);' \
          'box-shadow:0 0 18px rgba(255,50,50,.35);' \
          '}' \
          '.hm-playing{' \
          'box-shadow:0 0 22px rgba(60,190,255,.65)!important;' \
          '}' \
          '.hm-stable-info{' \
          'animation:none!important;' \
          'transition:none!important;' \
          'opacity:1!important;' \
          'visibility:visible!important;' \
          'transform:none!important;' \
          '}' \
          > "$FILE"

          test -s "$FILE"

          echo "CSS CREATED"

      - name: Attach Mobile Files
        shell: bash
        run: |
          set -e

          INDEX="$PROJECT/app/src/main/assets/index.html"

          python3 -c 'from pathlib import Path; p=Path("'"$INDEX"'"); s=p.read_text(encoding="utf-8"); css="<link rel=\"stylesheet\" href=\"css/mobile-stability.css\">"; js="<script src=\"js/mobile-stability.js\" defer></script>"; s=s if "mobile-stability.css" in s else s.replace("</head>",css+"</head>"); s=s if "mobile-stability.js" in s else s.replace("</body>",js+"</body>"); p.write_text(s,encoding="utf-8")'

          grep -q "mobile-stability.css" "$INDEX"
          grep -q "mobile-stability.js" "$INDEX"

          echo "FILES ATTACHED"

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$(find "$PROJECT/app/build/outputs/apk" -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK NOT GENERATED"
            find "$PROJECT/app/build" -type f -print || true
            exit 1
          fi

          mkdir -p release

          cp "$APK" release/HM-Studio-V6-Final.apk

          echo "APK:"
          ls -lh release/HM-Studio-V6-Final.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HM-Studio-V6-Final-APK
          path: release/HM-Studio-V6-Final.apk
          if-no-files-found: error
