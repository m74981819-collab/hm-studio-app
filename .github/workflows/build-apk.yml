name: HM Studio V6 - Stable APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GRADLE_VERSION: '8.11.1'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Extract V6 project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 3 -type f -name 'hm-studio-app-v6-corrected.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: hm-studio-app-v6-corrected.zip not found."
            exit 1
          fi

          rm -rf build-v6
          mkdir -p build-v6

          unzip -q "$ZIP" -d build-v6

          PROJECT="$(find build-v6 -type f -name settings.gradle -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project was not found."
            exit 1
          fi

          if [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle was not found."
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "======================================"
          echo "V6 PROJECT FOUND"
          echo "======================================"
          echo "Project: $PROJECT"

      - name: Apply stable mobile patch
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$PROJECT/app/src/main/assets/js"
          mkdir -p "$PROJECT/app/src/main/assets/css"

          printf '%s' '' | base64 -d > "$PROJECT/app/src/main/assets/js/stability-v6.js"

          printf '%s' '' | base64 -d > "$PROJECT/app/src/main/assets/css/stability-v6.css"

          python3 -c "from pathlib import Path; p=Path('$PROJECT/app/src/main/assets/index.html'); s=p.read_text(encoding='utf-8'); s=s.replace('<link rel=\"stylesheet\" href=\"css/red-effects.css\">','<link rel=\"stylesheet\" href=\"css/red-effects.css\"><link rel=\"stylesheet\" href=\"css/stability-v6.css\">'); s=s.replace('<script src=\"js/config.js\"></script><script src=\"js/app.js\"></script>','<script src=\"js/config.js\"></script><script src=\"js/app.js\"></script><script src=\"js/stability-v6.js\"></script>'); p.write_text(s,encoding='utf-8')"

          test -s "$PROJECT/app/src/main/assets/js/stability-v6.js"
          test -s "$PROJECT/app/src/main/assets/css/stability-v6.css"

          grep -q "stability-v6.css" "$PROJECT/app/src/main/assets/index.html"
          grep -q "stability-v6.js" "$PROJECT/app/src/main/assets/index.html"

          echo "PATCH APPLIED SUCCESSFULLY"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT/app/src/main/java/com/hmstudio/app/MainActivity.java"

          echo "======================================"
          echo "ANDROID PROJECT OK"
          echo "======================================"

          cd "$PROJECT"
          gradle --version

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILDING APK"
          echo "======================================"

          cd "$PROJECT"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT/app/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "======================================"
            echo "ERROR: APK NOT FOUND"
            echo "======================================"

            find "$PROJECT/app/build" \
              -maxdepth 8 \
              -type f \
              -print \
              | sort || true

            exit 1
          fi

          echo "======================================"
          echo "APK FOUND"
          echo "======================================"
          echo "$APK"

          mkdir -p apk-output

          cp "$APK" \
            apk-output/hm-studio-v6-stable-debug.apk

          test -s apk-output/hm-studio-v6-stable-debug.apk

          ls -lh apk-output/hm-studio-v6-stable-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hm-studio-v6-stable-debug
          path: apk-output/hm-studio-v6-stable-debug.apk
          if-no-files-found: error
          retention-days: 14
