name: HM Studio V6 Final APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract V6
        shell: bash
        run: |
          set -e

          ZIP="$(find . -type f -name 'hm-studio-app-v6-corrected.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: V6 ZIP NOT FOUND"
            find . -type f -name '*.zip' -print
            exit 1
          fi

          echo "V6 ZIP: $ZIP"

          rm -rf v6-project
          mkdir -p v6-project

          unzip -q "$ZIP" -d v6-project

          PROJECT="$(find v6-project -type f -name 'settings.gradle' -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: settings.gradle NOT FOUND"
            find v6-project -maxdepth 6 -type f | sort | head -200
            exit 1
          fi

          test -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT/app/src/main/assets/index.html"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "=============================="
          echo "ANDROID PROJECT:"
          echo "$PROJECT"
          echo "=============================="

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Android Project
        shell: bash
        run: |
          set -e
          cd "$PROJECT"

          echo "Gradle version:"
          gradle --version

          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "ANDROID PROJECT OK"

      - name: Create Mobile JavaScript
        shell: bash
        run: |
          set -e

          mkdir -p "$PROJECT/app/src/main/assets/js"

          echo '' | base64 -d > "$PROJECT/app/src/main/assets/js/mobile-stability.js"

          test -s "$PROJECT/app/src/main/assets/js/mobile-stability.js"

      - name: Create Mobile CSS
        shell: bash
        run: |
          set -e

          echo '' | base64 -d > "$PROJECT/app/src/main/assets/css/mobile-stability.css"

          test -s "$PROJECT/app/src/main/assets/css/mobile-stability.css"

      - name: Attach Stability Files
        shell: bash
        run: |
          set -e

          INDEX="$PROJECT/app/src/main/assets/index.html"

          python3 -c "from pathlib import Path; p=Path('$INDEX'); s=p.read_text(encoding='utf-8'); a='<link rel=\"stylesheet\" href=\"css/mobile-stability.css\">'; b='<script src=\"js/mobile-stability.js\" defer></script>'; s=s if 'mobile-stability.css' in s else s.replace('</head>',a+'\\n</head>'); s=s if 'mobile-stability.js' in s else s.replace('</body>',b+'\\n</body>'); p.write_text(s,encoding='utf-8')"

          grep -q "mobile-stability.css" "$INDEX"
          grep -q "mobile-stability.js" "$INDEX"

          echo "STABILITY FILES ATTACHED"

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$(find "$PROJECT/app/build/outputs/apk" -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK NOT GENERATED"
            find "$PROJECT/app/build" -maxdepth 8 -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          mkdir -p release
          cp "$APK" release/HM-Studio-V6-Final.apk

          ls -lh release/HM-Studio-V6-Final.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HM-Studio-V6-Final-APK
          path: release/HM-Studio-V6-Final.apk
          if-no-files-found: error
