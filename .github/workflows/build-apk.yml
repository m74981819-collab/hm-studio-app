name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Source & Grant Permissions
        run: |
          # If there is any zip file, unzip it
          find . -maxdepth 2 -name "*.zip" -exec unzip -o {} \; || true
          
          # Find gradlew in workspace
          GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLE_PATH" ]; then
            echo "::error::gradlew not found anywhere in repo!"
            ls -la
            exit 1
          fi
          
          WORKDIR=$(dirname "$GRADLE_PATH")
          echo "Found gradlew in: $WORKDIR"
          echo "PROJECT_DIR=$WORKDIR" >> $GITHUB_ENV
          chmod +x "$GRADLE_PATH"

      - name: Build APK with Gradle
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HM-Studio-App-APK
          path: '**/build/outputs/apk/debug/*.apk'
