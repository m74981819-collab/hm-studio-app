name: HM Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find project
        run: |
          unzip -q hm-studio-app-v6-corrected.zip -d v6
          echo "PROJECT=$(find v6 -name settings.gradle -printf '%h\n' | head -1)" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cd "$PROJECT"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Collect APK
        run: |
          find . -name "*.apk" -type f
          APK=$(find . -name "*.apk" -type f | head -1)
          test -n "$APK"
          cp "$APK" HM-Studio.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HM-Studio-APK
          path: HM-Studio.apk
