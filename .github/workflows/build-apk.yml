name: Build Android APK V4

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK V4
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find V4 ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR V4 ZIP"
          echo "======================================"

          ZIP_FILE="$(find . -maxdepth 1 -type f \
            -name 'hm-studio-app-v4-professional-fixed*.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: V4 ZIP not found."
            echo ""
            echo "ZIP files found:"
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          echo "V4 ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract V4
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q -o "$ZIP_FILE" -d extracted

          echo "======================================"
          echo "EXTRACTED PROJECT"
          echo "======================================"

          find extracted -maxdepth 5 -type f | sort

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          GRADLEW="$(find extracted -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."

            echo "Looking for Gradle files:"
            find extracted -type f \
              \( -name "settings.gradle" -o -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print

            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          echo "Gradle wrapper:"
          ./gradlew --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING DEBUG APK"
          echo "======================================"

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Search APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR GENERATED APK"
          echo "======================================"

          APK_FILE="$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Build directories:"
            find "$PROJECT_DIR" -type d -name build -print

            echo ""
            echo "Files under app/build:"
            find "$PROJECT_DIR/app/build" -type f -print 2>/dev/null || true

            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK_FILE"

          mkdir -p artifact

          cp "$APK_FILE" artifact/HM-Studio-V4-debug.apk

          echo ""
          echo "APK READY:"
          ls -lh artifact/HM-Studio-V4-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HM-Studio-V4-APK
          path: artifact/HM-Studio-V4-debug.apk
          if-no-files-found: error
          retention-days: 14
