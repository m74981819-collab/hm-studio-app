name: Build HM Studio APK V3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find V3 ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for V3 ZIP..."

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -name "hm-studio-app-v3-corrected.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: V3 ZIP not found."

            echo "ZIP files found:"
            find . -maxdepth 1 -type f -name "*.zip" -print

            exit 1
          fi

          echo "Found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract V3 Project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extracted."

          echo "Project files:"
          find extracted -maxdepth 5 -type f | sort | head -300

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          GRADLEW=$(find extracted -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found."

            find extracted -type f | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          echo "Starting Android build..."

          ./gradlew :app:assembleDebug --no-daemon --stacktrace

          echo "BUILD COMPLETED."

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo "Build directories:"
            find "$PROJECT_DIR" -type d -name "build" -print

            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          mkdir -p artifact

          cp "$APK" artifact/HM-Studio-V3-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HM-Studio-V3-APK
          path: artifact/HM-Studio-V3-debug.apk
          if-no-files-found: error
          retention-days: 7
