name: HM Studio V6 Final

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Find and Extract V6
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f -name 'hm-studio-app-v6-corrected.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "V6 ZIP NOT FOUND"
            find . -type f -name "*.zip"
            exit 1
          fi

          echo "Using V6:"
          echo "$ZIP"

          rm -rf v6
          mkdir v6

          unzip -q "$ZIP" -d v6

          PROJECT=$(find v6 -type f -name settings.gradle | head -n 1 | xargs dirname)

          if [ -z "$PROJECT" ]; then
            echo "ANDROID PROJECT NOT FOUND"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          test -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT/app/src/main/assets/index.html"

          echo "V6 PROJECT OK"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify V6
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          echo "Checking Gradle..."
          gradle --version

          echo "Checking assets..."
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/images/hossein-hero.png
          test -f app/src/main/assets/audio/ambient.mp3

          echo "V6 CHECK PASSED"

      - name: Build V6 APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK NOT FOUND"
            find "$PROJECT/app/build" -type f | head -n 200
            exit 1
          fi

          mkdir -p release

          cp "$APK" release/HM-Studio-V6.apk

          echo "APK CREATED:"
          ls -lh release/HM-Studio-V6.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HM-Studio-V6
          path: release/HM-Studio-V6.apk
          if-no-files-found: error
