name: Build Android APK V2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Find V2 ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for V2 ZIP..."

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*v2*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: V2 ZIP was not found."
            echo "ZIP files available:"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          echo "V2 ZIP found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract V2 ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          echo "Extracting V2 ZIP..."

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extraction completed."

          echo "Project files:"
          find extracted -maxdepth 5 -type f | head -300

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "Searching for Gradle project..."

          GRADLEW=$(find extracted -type f -name "gradlew" -print -quit)

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW")
          else
            SETTINGS=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)

            if [ -n "$SETTINGS" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS")
            else
              echo "ERROR: Android project was not found."

              echo "Gradle files found:"
              find extracted -type f \( \
                -name "gradlew" \
                -o -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
                -o -name "build.gradle" \
                -o -name "build.gradle.kts" \
              \) -print

              exit 1
            fi
          fi

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            echo "Gradle wrapper ready."
          else
            echo "Gradle wrapper not found."
            echo "System Gradle will be used."
          fi

      - name: Build Android Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING ANDROID APK"
          echo "======================================"

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Search APK Everywhere
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          find . -type f -name "*.apk" -print

          APK_FILE=$(find . -type f -name "*.apk" -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Build directories:"
            find . -type d -name "build" -print

            echo ""
            echo "Output directories:"
            find . -type d -name "outputs" -print

            echo ""
            echo "Files inside project:"
            find "$PROJECT_DIR" -type f | head -500

            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK_FILE"

          rm -rf artifact
          mkdir -p artifact

          cp "$APK_FILE" artifact/app-debug.apk

          echo "Final APK:"
          ls -lh artifact/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HM-Studio-App-V2-APK
          path: artifact/app-debug.apk
          if-no-files-found: error
          retention-days: 7
