name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Project Files
        run: |
          if [ -f "android_source_for_github.zip" ]; then
            echo "Unzipping source..."
            unzip -o -q android_source_for_github.zip
          fi

      - name: Make Gradlew Executable and Build
        run: |
          SETTINGS_FILE=$(find . -name "settings.gradle" -not -path "*/.*" | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            echo "Moving to $PROJECT_DIR"
            cd "$PROJECT_DIR"
          fi
          
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HM-Studio-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/*.apk
          if-no-files-found: warn
