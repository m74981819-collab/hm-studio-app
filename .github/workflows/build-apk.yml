      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew --no-daemon --console=plain clean assembleDebug

          echo "Searching for generated APK..."
          find "$GITHUB_WORKSPACE/v6-source" -type f -name "*.apk" -print

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK="$(find "$GITHUB_WORKSPACE/v6-source" -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            echo "Gradle project:"
            echo "$PROJECT_DIR"
            echo ""
            echo "APK files found:"
            find "$GITHUB_WORKSPACE/v6-source" -type f -name '*.apk' -print || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"
          ls -lh "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/HM-Studio-V6-Bugfix.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HM-Studio-V6-Bugfix
          path: HM-Studio-V6-Bugfix.apk
          if-no-files-found: error
