name: HM Studio V6 Final

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Find and Extract V6
        shell: bash
        run: |
          set -e

          echo "Searching for V6 ZIP..."

          ZIP=$(find . -type f \
            -name 'hm-studio-app-v6-corrected.zip' \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: V6 ZIP NOT FOUND"
            echo "Available ZIP files:"
            find . -type f -name "*.zip" -print
            exit 1
          fi

          echo "V6 ZIP:"
          echo "$ZIP"

          rm -rf v6
          mkdir -p v6

          unzip -q "$ZIP" -d v6

          echo "Searching Android project..."

          PROJECT=$(find v6 \
            -type f \
            -name settings.gradle \
            -print \
            | head -n 1 \
            | xargs -r dirname)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found"
            find v6 -maxdepth 5 -type f | head -n 200
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "Project:"
          echo "$PROJECT"

          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT/app/src/main/assets/index.html"

          echo "V6 PROJECT FOUND"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify V6 Assets
        shell: bash
        run: |
          set -e

          echo "Checking Gradle..."

          gradle --version

          echo "Checking V6 files..."

          test -f "$PROJECT/app/src/main/assets/index.html"

          echo "index.html: OK"

          test -f "$PROJECT/app/src/main/assets/assets/audio/ambient.mp3"

          echo "ambient.mp3: OK"

          test -f "$PROJECT/app/src/main/assets/assets/images/hossein-hero.png"

          echo "hossein-hero.png: OK"

          test -f "$PROJECT/app/src/main/assets/assets/video/hossein-brand-film.mp4"

          echo "hero video: OK"

          echo "===================================="
          echo "V6 ASSET CHECK PASSED"
          echo "===================================="

      - name: Build V6 Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          echo "===================================="
          echo "BUILDING HM STUDIO V6"
          echo "===================================="

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          APK=$(find "$PROJECT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "===================================="
            echo "ERROR: APK NOT GENERATED"
            echo "===================================="

            echo "Build output:"
            find "$PROJECT/app/build" \
              -maxdepth 8 \
              -type f \
              -print || true

            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          mkdir -p release

          cp "$APK" \
            release/HM-Studio-V6.apk

          echo "===================================="
          echo "APK READY"
          echo "===================================="

          ls -lh release/HM-Studio-V6.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HM-Studio-V6
          path: release/HM-Studio-V6.apk
          if-no-files-found: error
