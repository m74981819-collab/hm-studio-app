name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Project Files
        run: |
          if [ -f "android_source_for_github.zip" ]; then
            echo "Unzipping android_source_for_github.zip..."
            unzip -o -q android_source_for_github.zip
          fi
          # نمایش لیست فایل‌ها برای اطمینان از وجود پوشه
          ls -la

      - name: Build with Gradle Wrapper
        run: |
          # پیدا کردن مسیر دقیق پوشه اندروید
          if [ -d "android-app" ]; then
            cd android-app
          elif [ -f "gradlew" ]; then
            echo "Already in root"
          else
            TARGET_DIR=$(find . -name "gradlew" -exec dirname {} \; | head -n 1)
            if [ -n "$TARGET_DIR" ]; then
              cd "$TARGET_DIR"
            fi
          fi

          echo "Current working directory: $(pwd)"
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HM-Studio-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/*.apk
          if-no-files-found: error
