name: Build Android APK # نام ورک‌فلو

on: [push] # اجرای خودکار بعد از ذخیره تغییرات

jobs:
  build:
    runs-on: ubuntu-latest # سرور مجازی لینوکس

    steps:
      - name: Checkout repository # دریافت فایل‌های ریپازیتوری
        uses: actions/checkout@v4

      - name: Extract zip # خارج کردن فایل زیپ سورس اندروید
        run: unzip -o android_source_for_github.zip -d .

      - name: Set up JDK # نصب جاوا ۱۷ برای ساخت برنامه
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission # اجازه اجرای دستورات گریدل
        run: chmod +x android-app/gradlew

      - name: Build with Gradle # کامپایل سورس و تولید فایل APK
        run: ./android-app/gradlew assembleDebug --project-dir android-app

      - name: Upload APK # آماده‌سازی خروجی APK برای دانلود
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
