name: HM Studio V6 Stable APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract V6
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f -name 'hm-studio-app-v6-corrected.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: V6 ZIP NOT FOUND"
            exit 1
          fi

          echo "V6 ZIP: $ZIP"

          rm -rf v6-project
          mkdir -p v6-project

          unzip -q "$ZIP" -d v6-project

          PROJECT=$(find v6-project -type f -name 'settings.gradle' -print -quit | xargs -r dirname)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: settings.gradle NOT FOUND"
            find v6-project -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "ANDROID PROJECT:"
          echo "$PROJECT"

      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check Android project
        shell: bash
        run: |
          set -e

          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"

          echo "ANDROID PROJECT OK"

          cd "$PROJECT"

          gradle --version

      - name: Apply V6 mobile stability patch
        shell: bash
        run: |
          set -e

          INDEX="$PROJECT/app/src/main/assets/index.html"
          JS="$PROJECT/app/src/main/assets/js/hm-v6-stability.js"
          CSS="$PROJECT/app/src/main/assets/css/hm-v6-stability.css"

          if [ ! -f "$INDEX" ]; then
            echo "ERROR: index.html not found"
            exit 1
          fi

          mkdir -p "$(dirname "$JS")"
          mkdir -p "$(dirname "$CSS")"

          cat > "$JS" <<'JAVASCRIPT'
(function () {
  'use strict';

  function getLang() {
    return document.documentElement.lang || 'fa';
  }

  function updateStableClock() {
    var now = new Date();
    var lang = getLang();

    var locale =
      lang === 'fa'
        ? 'fa-IR-u-ca-persian'
        : lang === 'ar'
          ? 'ar-SA-u-ca-islamic'
          : 'en-US';

    var time = new Intl.DateTimeFormat(locale, {
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false
    }).format(now);

    var date = new Intl.DateTimeFormat(locale, {
      day: 'numeric',
      month: 'long',
      year: 'numeric'
    }).format(now);

    var clock = document.getElementById('hmStableClock');

    if (!clock) {
      clock = document.createElement('div');
      clock.id = 'hmStableClock';
      clock.className = 'hm-stable-clock';

      var hero =
        document.querySelector('.hero') ||
        document.querySelector('.hud-depth') ||
        document.body;

      hero.appendChild(clock);
    }

    clock.textContent = time + '  ·  ' + date;
  }

  function hideProblematicLayers() {
    var selectors = [
      '.hud-depth',
      '.scene .screen',
      '.scene .glass-console',
      '.scene .depth-layer',
      '.scene .holo-layer'
    ];

    document.querySelectorAll(selectors.join(',')).forEach(function (element) {
      element.classList.add('hm-static-hidden');
    });
  }

  function installOrderForm() {
    var form = document.getElementById('projectForm');

    if (!form || form.dataset.hmStableInstalled === '1') {
      return;
    }

    form.dataset.hmStableInstalled = '1';

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      var data = Object.fromEntries(
        new FormData(form).entries()
      );

      var message = [
        'HM Studio - Project Request',
        '------------------------------',
        'First name: ' + (data.firstName || data.firstname || ''),
        'Last name: ' + (data.lastName || data.lastname || ''),
        'Email: ' + (data.email || ''),
        'Phone: ' + (data.phone || ''),
        'Project: ' + (data.projectType || data.project || ''),
        'Budget: ' + (data.budget || ''),
        'Location: ' + (data.location || ''),
        'Description: ' + (data.description || '')
      ].join('\n');

      var actions = document.getElementById('hmOrderActions');

      if (!actions) {
        actions = document.createElement('div');
        actions.id = 'hmOrderActions';
        actions.className = 'hm-order-actions';
        form.appendChild(actions);
      }

      actions.innerHTML = '';

      var lang = getLang();

      var labels =
        lang === 'fa'
          ? ['واتساپ', 'پیامک', 'تلگرام', 'ایمیل']
          : lang === 'ar'
            ? ['واتساب', 'SMS', 'تلغرام', 'البريد']
            : ['WhatsApp', 'SMS', 'Telegram', 'Email'];

      var phone = '+989399020094';
      var email = 'm74981819@gmail.com';

      function addButton(label, callback) {
        var button = document.createElement('button');

        button.type = 'button';
        button.className = 'hm-send';
        button.textContent = label;

        button.addEventListener('click', callback);

        actions.appendChild(button);
      }

      addButton(labels[0], function () {
        window.location.href =
          'https://wa.me/' +
          phone +
          '?text=' +
          encodeURIComponent(message);
      });

      addButton(labels[1], function () {
        window.location.href =
          'sms:' +
          phone +
          '?body=' +
          encodeURIComponent(message);
      });

      addButton(labels[2], function () {
        window.location.href =
          'https://t.me/share/url?url=&text=' +
          encodeURIComponent(message);
      });

      addButton(labels[3], function () {
        window.location.href =
          'mailto:' +
          email +
          '?subject=' +
          encodeURIComponent('HM Studio Project Request') +
          '&body=' +
          encodeURIComponent(message);
      });

      actions.scrollIntoView({
        behavior: 'smooth',
        block: 'nearest'
      });
    });
  }

  function boot() {
    hideProblematicLayers();
    installOrderForm();
    updateStableClock();

    setInterval(updateStableClock, 1000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener(
      'DOMContentLoaded',
      boot,
      { once: true }
    );
  } else {
    boot();
  }
})();
JAVASCRIPT

          cat > "$CSS" <<'STYLES'
.hm-stable-clock {
  display: block !important;
  position: relative !important;
  z-index: 50 !important;
  width: min(90%, 420px) !important;
  box-sizing: border-box !important;
  margin: 10px auto 0 !important;
  padding: 10px 12px !important;
  border-radius: 14px !important;
  background: rgba(8, 12, 18, 0.94) !important;
  color: #ffffff !important;
  text-align: center !important;
  font: 600 15px/1.5 system-ui, sans-serif !important;
  opacity: 1 !important;
  visibility: visible !important;
  animation: none !important;
  transition: none !important;
  white-space: normal !important;
}

.hm-static-hidden {
  animation: none !important;
  transition: none !important;
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
}

.hm-order-actions {
  display: flex !important;
  flex-wrap: wrap !important;
  gap: 8px !important;
  width: 100% !important;
  margin-top: 12px !important;
}

.hm-send {
  min-height: 46px !important;
  flex: 1 1 140px !important;
  border: 0 !important;
  border-radius: 12px !important;
  padding: 10px 14px !important;
  font: 700 14px/1.3 system-ui, sans-serif !important;
  cursor: pointer !important;
  touch-action: manipulation !important;
}

@media (hover: none) {
  .hm-send:active {
    transform: translateY(1px);
    box-shadow:
      0 0 0 2px rgba(220, 38, 38, 0.18),
      0 0 16px rgba(220, 38, 38, 0.22);
  }
}

@media (max-width: 600px) {
  .hm-stable-clock {
    font-size: 14px !important;
  }

  .hm-order-actions {
    display: grid !important;
    grid-template-columns: 1fr 1fr !important;
  }

  .hm-send {
    width: 100% !important;
  }
}
STYLES

          python3 - <<'PY'
from pathlib import Path

p = Path("PROJECT_PLACEHOLDER")
PY

          python3 -c "
from pathlib import Path
p=Path('$INDEX')
s=p.read_text(encoding='utf-8')

css='css/hm-v6-stability.css'
js='js/hm-v6-stability.js'

if css not in s:
    s=s.replace('</head>', '<link rel=\"stylesheet\" href=\"'+css+'\">\\n</head>', 1)

if js not in s:
    s=s.replace('</body>', '<script src=\"'+js+'\"></script>\\n</body>', 1)

p.write_text(s, encoding='utf-8')
"

          grep -q "hm-v6-stability.css" "$INDEX"
          grep -q "hm-v6-stability.js" "$INDEX"

          echo "V6 PATCH OK"

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          echo "========================================"
          echo "BUILD START"
          echo "========================================"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain

          echo "========================================"
          echo "BUILD FINISHED"
          echo "========================================"

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT/app/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "========================================"
            echo "ERROR: APK NOT FOUND"
            echo "========================================"

            find "$PROJECT/app/build" \
              -type f \
              -print \
              | sort

            exit 1
          fi

          echo "========================================"
          echo "APK FOUND"
          echo "========================================"
          echo "$APK"

          mkdir -p apk-output

          cp "$APK" \
            apk-output/hm-studio-v6-stable-debug.apk

          test -s apk-output/hm-studio-v6-stable-debug.apk

          ls -lh apk-output/hm-studio-v6-stable-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hm-studio-v6-stable-debug
          path: apk-output/hm-studio-v6-stable-debug.apk
          if-no-files-found: error
          retention-days: 14
