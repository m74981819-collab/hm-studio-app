name: Build Android APK (from NOR_FINAL_V18_FINAL_DELIVERY.zip)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on:, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unzip project
        run: |
          ls -la
          unzip -o "NOR_FINAL_V18_FINAL_DELIVERY.zip"
          ls -la
          ls -la android-app

      - name: Build Debug APK
        working-directory: android-app
        run: |
          yes | sdkmanager --licenses || true
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HMStudio-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
