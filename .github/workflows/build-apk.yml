name: Build HM Studio V6 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.11.1"

jobs:
  build:
    name: Build HM Studio V6 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract V6 source
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "FINDING V6 SOURCE ZIP"
          echo "======================================"

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -type f -name 'hm-studio-app-v6-corrected.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: hm-studio-app-v6-corrected.zip was not found."
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -print | sort || true
            exit 1
          fi

          echo "V6 ZIP:"
          echo "$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/v6-source"
          mkdir -p "$GITHUB_WORKSPACE/v6-source"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/v6-source"

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/v6-source" -type f -name 'settings.gradle' -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle was not found after extraction."
            find "$GITHUB_WORKSPACE/v6-source" -maxdepth 5 -type f -print | sort || true
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f -print | sort | head -200

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Verify V6 Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "VERIFYING ANDROID PROJECT"
          echo "======================================"

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/hmstudio/app/MainActivity.java"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Android project verification passed."

      - name: Add V6 bugfix CSS
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$PROJECT_DIR/app/src/main/assets/css"

          cat > "$PROJECT_DIR/app/src/main/assets/css/hm-v6-bugfix.css" <<'EOF'
          html,
          body {
            overflow-x: hidden !important;
          }

          .live-clock,
          #clock {
            display: inline-flex !important;
            visibility: visible !important;
            opacity: 1 !important;
            animation: none !important;
            transition: none !important;
            transform: none !important;
            white-space: nowrap !important;
          }

          #heroClock,
          #heroDate,
          #heroCalendar,
          #heroWeekday {
            visibility: visible !important;
            opacity: 1 !important;
            animation: none !important;
            transition: none !important;
            transform: none !important;
          }

          [data-i18n="depthLabel"] {
            display: none !important;
          }

          .glass-console strong[data-i18n="depthLabel"] {
            display: none !important;
          }

          .header-tools .icon-btn,
          .header-tools .music-btn,
          .header-tools button {
            min-width: 44px !important;
            width: 44px !important;
            min-height: 44px !important;
            height: 44px !important;
            box-sizing: border-box !important;
          }

          .hm-v6-stable-info {
            animation: none !important;
            transition: none !important;
            transform: none !important;
          }

          .hm-v6-touch {
            animation: hmV6Touch 140ms ease-out !important;
          }

          @keyframes hmV6Touch {
            0% {
              filter: brightness(1);
            }

            50% {
              filter: brightness(1.30);
            }

            100% {
              filter: brightness(1);
            }
          }
          EOF

      - name: Add V6 bugfix JavaScript
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$PROJECT_DIR/app/src/main/assets/js"

          cat > "$PROJECT_DIR/app/src/main/assets/js/hm-v6-bugfix.js" <<'EOF'
          (function () {
            "use strict";

            function hideDepthLabel() {
              document
                .querySelectorAll('[data-i18n="depthLabel"]')
                .forEach(function (el) {
                  el.style.display = "none";
                });
            }

            function stabilizeExistingClock() {
              [
                "#clock",
                "#heroClock",
                "#heroDate",
                "#heroCalendar",
                "#heroWeekday"
              ].forEach(function (selector) {
                document
                  .querySelectorAll(selector)
                  .forEach(function (el) {
                    el.classList.add("hm-v6-stable-info");
                  });
              });
            }

            function addShortTouchFeedback() {
              document.addEventListener(
                "pointerdown",
                function (event) {
                  var target = event.target.closest(
                    "button, .icon-btn, .music-btn, a"
                  );

                  if (!target) {
                    return;
                  }

                  target.classList.remove("hm-v6-touch");

                  void target.offsetWidth;

                  target.classList.add("hm-v6-touch");

                  window.setTimeout(function () {
                    target.classList.remove("hm-v6-touch");
                  }, 180);
                },
                { passive: true }
              );
            }

            function removeOldPatchElements() {
              var oldClock =
                document.getElementById("hm-stable-clock");

              if (oldClock) {
                oldClock.remove();
              }

              var oldFeatures =
                document.getElementById("hm-features-button");

              if (oldFeatures) {
                oldFeatures.remove();
              }
            }

            function init() {
              removeOldPatchElements();
              hideDepthLabel();
              stabilizeExistingClock();
              addShortTouchFeedback();
            }

            if (document.readyState === "loading") {
              document.addEventListener(
                "DOMContentLoaded",
                init,
                { once: true }
              );
            } else {
              init();
            }
          })();
          EOF

      - name: Attach V6 bugfix files
        shell: bash
        run: |
          set -euo pipefail

          INDEX="$PROJECT_DIR/app/src/main/assets/index.html"

          python3 - "$INDEX" <<'PY'
          import sys
          from pathlib import Path

          index = Path(sys.argv[1])
          text = index.read_text(encoding="utf-8")

          css_tag = '<link rel="stylesheet" href="css/hm-v6-bugfix.css">'
          js_tag = '<script src="js/hm-v6-bugfix.js"></script>'

          if css_tag not in text:
              if "</head>" not in text:
                  raise SystemExit("ERROR: </head> not found")
              text = text.replace(
                  "</head>",
                  css_tag + "\n</head>",
                  1
              )

          if js_tag not in text:
              if "</body>" not in text:
                  raise SystemExit("ERROR: </body> not found")
              text = text.replace(
                  "</body>",
                  js_tag + "\n</body>",
                  1
              )

          index.write_text(text, encoding="utf-8")

          print("Bugfix CSS and JavaScript attached successfully.")
          PY

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILDING HM STUDIO V6 APK"
          echo "======================================"

          cd "$PROJECT_DIR"

          echo "Gradle version:"
          gradle --version

          echo "Starting Android build..."

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

          echo "Android build completed successfully."

      - name: Locate generated APK
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "LOCATING GENERATED APK"
          echo "======================================"

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            -print \
            -quit 2>/dev/null || true)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo "Build output tree:"
            find "$PROJECT_DIR/app/build" \
              -maxdepth 10 \
              -type f \
              -print \
              2>/dev/null \
              | sort || true

            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-output/HM-Studio-V6-Bugfix.apk"

          echo "Final APK:"
          ls -lh \
            "$GITHUB_WORKSPACE/apk-output/HM-Studio-V6-Bugfix.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HM-Studio-V6-Bugfix
          path: apk-output/HM-Studio-V6-Bugfix.apk
          if-no-files-found: error
          retention-days: 14
