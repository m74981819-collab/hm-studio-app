        run: |
          set -e

          cd "$PROJECT"

          echo "======================================"
          echo "VERIFY APK"
          echo "======================================"

          APK_COUNT=$(find . -type f -name "*.apk" | wc -l)

          echo "APK COUNT: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK WAS NOT GENERATED"
            echo ""
            echo "BUILD OUTPUT:"
            find . -type d -name build -print
            echo ""
            echo "ALL FILES:"
            find . -type f | head -500
            exit 1
          fi

          echo ""
          echo "GENERATED APK FILES:"
          find . -type f -name "*.apk" -print

      - name: Copy APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          APK=$(find . -type f -name "*.apk" \
            -path "*/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            APK=$(find . -type f -name "*.apk" -print -quit)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK NOT FOUND"
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-output/hm-studio-app-v6-final-debug.apk"

          echo ""
          echo "FINAL APK:"
          ls -lh \
            "$GITHUB_WORKSPACE/apk-output/hm-studio-app-v6-final-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hm-studio-app-v6-final-debug
          path: apk-output/hm-studio-app-v6-final-debug.apk
          if-no-files-found: error
