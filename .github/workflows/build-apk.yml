name: Build HM Studio APK V6 FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build HM Studio APK V6 FINAL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract V6
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          test -f hm-studio-app-v6-corrected.zip
          unzip -o hm-studio-app-v6-corrected.zip -d extracted
          echo "V6 extracted"

      - name: Locate Project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f -name "settings.gradle" -print -quit)

          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find extracted -type f -name "settings.gradle.kts" -print -quit)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found"
            exit 1
          fi

          PROJECT=$(dirname "$SETTINGS")

          echo "PROJECT=$PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Verify Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          test -d app

          echo "Project:"
          pwd

          echo "App:"
          ls -la app

          echo "Gradle:"
          gradle --version

      - name: Apply Safe Mobile Fix
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          INDEX=$(find app/src/main/assets -type f -name "index.html" -print -quit)

          if [ -z "$INDEX" ]; then
            echo "ERROR: index.html not found"
            exit 1
          fi

          echo "Patching:"
          echo "$INDEX"

          python3 - "$INDEX" <<'PY'
import sys
from pathlib import Path

p = Path(sys.argv[1])
html = p.read_text(encoding="utf-8", errors="ignore")

css = r'''
<style id="hm-v6-final-stability">
/* HM STUDIO V6 - stable mobile UI */

html,
body {
  overflow-x: hidden !important;
  -webkit-tap-highlight-color: transparent;
}

/* Remove blinking/flickering from time/info areas */
[class*="clock"],
[class*="time"],
[class*="date"],
[class*="datetime"],
[id*="clock"],
[id*="time"],
[id*="date"] {
  animation: none !important;
  -webkit-animation: none !important;
  transition: none !important;
  -webkit-transition: none !important;
  transform: none !important;
  filter: none !important;
  will-change: auto !important;
}

/* Keep small information text stable */
[class*="clock"],
[class*="time"],
[class*="date"],
[id*="clock"],
[id*="time"],
[id*="date"] {
  line-height: 1.5 !important;
  min-height: 24px;
}

/* Remove permanent hover movement on touch devices */
@media (hover: none) and (pointer: coarse) {
  a:hover,
  button:hover,
  [role="button"]:hover,
  .card:hover,
  .project:hover,
  .service:hover {
    transform: none !important;
    filter: none !important;
  }
}

/* Short red touch effect */
.hm-v6-touch {
  animation: hm-v6-red-touch .22s ease-out !important;
}

@keyframes hm-v6-red-touch {
  0% {
    box-shadow: 0 0 0 rgba(255,0,0,0);
  }

  45% {
    box-shadow:
      0 0 10px rgba(255,0,0,.40),
      0 0 20px rgba(255,0,0,.18);
  }

  100% {
    box-shadow: 0 0 0 rgba(255,0,0,0);
  }
}

/* Order sending panel */
#hm-v6-send-panel {
  display: none;
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: calc(12px + env(safe-area-inset-bottom));
  z-index: 2147483647;
  padding: 14px;
  border-radius: 18px;
  background: rgba(18,18,22,.97);
  color: white;
  box-shadow: 0 12px 40px rgba(0,0,0,.45);
  border: 1px solid rgba(255,255,255,.15);
}

#hm-v6-send-panel.show {
  display: block;
}

#hm-v6-send-panel .title {
  text-align: center;
  font-weight: 700;
  margin-bottom: 10px;
}

#hm-v6-send-panel .grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

#hm-v6-send-panel button {
  min-height: 44px;
  border: 0;
  border-radius: 12px;
  background: rgba(255,255,255,.10);
  color: white;
  font-weight: 700;
}

#hm-v6-send-panel .close {
  width: 100%;
  margin-top: 8px;
}
</style>
'''

js = r'''
<script id="hm-v6-final-stability-js">
(function () {
  "use strict";

  function getContactLinks() {
    var links = document.querySelectorAll("a[href]");
    var result = {
      whatsapp: "",
      sms: "",
      telegram: "",
      email: ""
    };

    Array.prototype.forEach.call(links, function (a) {
      var h = String(a.getAttribute("href") || "");
      var l = h.toLowerCase();

      if (!result.whatsapp &&
          (l.indexOf("wa.me/") >= 0 ||
           l.indexOf("whatsapp") >= 0)) {
        result.whatsapp = h;
      }

      if (!result.sms && l.indexOf("sms:") === 0) {
        result.sms = h;
      }

      if (!result.telegram &&
          (l.indexOf("t.me/") >= 0 ||
           l.indexOf("telegram") >= 0)) {
        result.telegram = h;
      }

      if (!result.email && l.indexOf("mailto:") === 0) {
        result.email = h;
      }
    });

    return result;
  }

  function formMessage(form) {
    var lines = [
      "سلام، سفارش جدید از HM Studio",
      "--------------------"
    ];

    var fields = form.querySelectorAll(
      "input, textarea, select"
    );

    Array.prototype.forEach.call(fields, function (field) {
      if (field.disabled) return;

      var type = String(field.type || "").toLowerCase();

      if (
        type === "submit" ||
        type === "button" ||
        type === "reset" ||
        type === "hidden"
      ) {
        return;
      }

      var value = String(field.value || "").trim();

      if (!value) return;

      var label =
        field.getAttribute("aria-label") ||
        field.getAttribute("placeholder") ||
        field.getAttribute("name") ||
        field.id ||
        "اطلاعات";

      lines.push(label + ": " + value);
    });

    lines.push("--------------------");
    lines.push("ارسال از اپلیکیشن HM Studio");

    return lines.join("\n");
  }

  function makeUrl(type, message, links) {
    var encoded = encodeURIComponent(message);

    if (type === "whatsapp") {
      if (!links.whatsapp) return "";

      var number = links.whatsapp.match(
        /wa\.me\/([0-9]+)/i
      );

      if (number) {
        return "https://wa.me/" +
          number[1] +
          "?text=" +
          encoded;
      }

      if (links.whatsapp.indexOf("?") >= 0) {
        return links.whatsapp + "&text=" + encoded;
      }

      return links.whatsapp + "?text=" + encoded;
    }

    if (type === "sms") {
      if (!links.sms) return "";

      var sms = links.sms.replace(/^sms:/i, "");
      sms = sms.split("?")[0];

      return "sms:" + sms + "?body=" + encoded;
    }

    if (type === "email") {
      if (!links.email) return "";

      var email = links.email.replace(/^mailto:/i, "");
      email = email.split("?")[0];

      return "mailto:" +
        email +
        "?subject=" +
        encodeURIComponent("سفارش جدید HM Studio") +
        "&body=" +
        encoded;
    }

    if (type === "telegram") {
      return links.telegram || "";
    }

    return "";
  }

  function openUrl(url) {
    if (!url) return;

    window.location.href = url;
  }

  function createPanel() {
    var old = document.getElementById("hm-v6-send-panel");

    if (old) return old;

    var panel = document.createElement("div");

    panel.id = "hm-v6-send-panel";

    panel.innerHTML =
      '<div class="title">ارسال سفارش</div>' +
      '<div class="grid">' +
      '<button type="button" data-send="whatsapp">WhatsApp</button>' +
      '<button type="button" data-send="sms">پیامک</button>' +
      '<button type="button" data-send="telegram">Telegram</button>' +
      '<button type="button" data-send="email">Email</button>' +
      '</div>' +
      '<button type="button" class="close">بستن</button>';

    document.body.appendChild(panel);

    return panel;
  }

  function setupForms() {
    var forms = document.querySelectorAll("form");

    Array.prototype.forEach.call(forms, function (form) {
      if (form.dataset.hmV6Ready === "1") return;

      var fields = form.querySelectorAll(
        "input, textarea, select"
      );

      if (fields.length < 2) return;

      form.dataset.hmV6Ready = "1";

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        event.stopPropagation();

        var message = formMessage(form);
        var links = getContactLinks();
        var panel = createPanel();

        panel.classList.add("show");

        var buttons = panel.querySelectorAll(
          "[data-send]"
        );

        Array.prototype.forEach.call(buttons, function (button) {
          var type = button.getAttribute("data-send");
          var url = makeUrl(type, message, links);

          button.disabled = !url;
          button.style.opacity = url ? "1" : ".35";

          button.onclick = function () {
            if (url) {
              openUrl(url);
            }
          };
        });

        var close = panel.querySelector(".close");

        if (close) {
          close.onclick = function () {
            panel.classList.remove("show");
          };
        }
      }, true);
    });
  }

  function setupTouchEffect() {
    document.addEventListener("pointerdown", function (event) {
      var target = event.target;

      if (!(target instanceof Element)) return;

      var el = target.closest(
        "button, a, [role='button'], .card, .project, .service"
      );

      if (!el) return;

      el.classList.remove("hm-v6-touch");

      void el.offsetWidth;

      el.classList.add("hm-v6-touch");

      setTimeout(function () {
        el.classList.remove("hm-v6-touch");
      }, 260);
    }, { passive: true });
  }

  function start() {
    setupForms();
    setupTouchEffect();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start, {
      once: true
    });
  } else {
    start();
  }

  setTimeout(setupForms, 800);
  setTimeout(setupForms, 1800);

})();
</script>
'''

if "hm-v6-final-stability" not in html:
    if "</head>" in html:
        html = html.replace("</head>", css + "\n</head>", 1)
    else:
        html = css + html

if "hm-v6-final-stability-js" not in html:
    if "</body>" in html:
        html = html.replace("</body>", js + "\n</body>", 1)
    else:
        html += js

p.write_text(html, encoding="utf-8")

print("FINAL PATCH APPLIED")
print("FILE:", p)
print("SIZE:", p.stat().st_size)
PY

          echo "Patch completed"

      - name: Validate Patch
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          INDEX=$(find app/src/main/assets -type f -name "index.html" -print -quit)

          test -n "$INDEX"

          grep -q "hm-v6-final-stability" "$INDEX"
          grep -q "hm-v6-final-stability-js" "$INDEX"

          echo "Patch validation OK"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          echo "======================================"
          echo "BUILDING APK"
          echo "======================================"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

          echo ""
          echo "APK FILES:"
          find . -type f -name "*.apk" -print

      - name: Verify APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          APK=$(find . -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK NOT GENERATED"
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

      - name: Copy APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          APK=$(find . -type f -name "*.apk" -print -quit)

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-output/hm-studio-app-v6-final-debug.apk"

          ls -lh \
            "$GITHUB_WORKSPACE/apk-output/hm-studio-app-v6-final-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hm-studio-app-v6-final-debug
          path: apk-output/hm-studio-app-v6-final-debug.apk
          if-no-files-found: error
